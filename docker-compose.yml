services:
  # PostgreSQL database using docker image postgres:16
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: orders
      POSTGRES_USER: app
      POSTGRES_PASSWORD: localdev #TODO: Change this to a secure password from AWS Secrets Manager
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  # Redis database using docker image redis:7-alpine
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  # API Gateway service using Dockerfile in ./services/api-gateway
  api-gateway:
    build: ./services/api-gateway
    ports:
      - "8080:8080"
    environment:
      REDIS_URL: redis://redis:6379
      JWT_SECRET: local-dev-secret #TODO: Change this to a secure secret
      ORDER_SERVICE_URL: http://order-service:8081
      INVENTORY_SERVICE_URL: http://inventory-service:8082
      PAYMENT_SERVICE_URL: http://payment-service:8083
      NOTIFICATION_SERVICE_URL: http://notification-service:8084
      SHIPPING_SERVICE_URL: http://shipping-service:8085
      DASHBOARD_SERVICE_URL: http://dashboard-api:8086
    depends_on:
      - redis

  # Order service using Dockerfile in ./services/order-service
  order-service:
    build: ./services/order-service
    ports:
      - "8081:8081"
    environment:
      DATABASE_URL: postgres://app:localdev@postgres:5432/orders?sslmode=disable
      SQS_QUEUE_URL: http://localstack:4566/000000000000/order-events
    depends_on:
      - postgres

  # Inventory service using Dockerfile in ./services/inventory-service
  inventory-service:
    build: ./services/inventory-service
    ports:
      - "8082:8082"
    environment:
      DATABASE_URL: postgres://app:localdev@postgres:5432/orders?sslmode=disable
    depends_on:
      - postgres

  # Payment service using Dockerfile in ./services/payment-service
  payment-service:
    build: ./services/payment-service
    ports:
      - "8083:8083"
    environment:
      DATABASE_URL: postgres://app:localdev@postgres:5432/orders?sslmode=disable
      SQS_QUEUE_URL: http://localstack:4566/000000000000/order-events
    depends_on:
      - postgres

  # Notification service using Dockerfile in ./services/notification-service
  notification-service:
    build: ./services/notification-service
    ports:
      - "8084:8084"
    environment:
      DATABASE_URL: postgres://app:localdev@postgres:5432/orders?sslmode=disable
    depends_on:
      - postgres

  # Shipping service using Dockerfile in ./services/shipping-service
  shipping-service:
    build: ./services/shipping-service
    ports:
      - "8085:8085"
    environment:
      DATABASE_URL: postgres://app:localdev@postgres:5432/orders?sslmode=disable
      SQS_QUEUE_URL: http://localstack:4566/000000000000/order-events
    depends_on:
      - postgres

  # Worker service using Dockerfile in ./services/worker
  worker:
    build: ./services/worker
    environment:
      SQS_QUEUE_URL: http://localstack:4566/000000000000/order-events
      ORDER_SERVICE_URL: http://order-service:8081
      INVENTORY_SERVICE_URL: http://inventory-service:8082
      PAYMENT_SERVICE_URL: http://payment-service:8083
      NOTIFICATION_SERVICE_URL: http://notification-service:8084
      SHIPPING_SERVICE_URL: http://shipping-service:8085

  # Scheduler service using Dockerfile in ./services/scheduler
  scheduler:
    build: ./services/scheduler
    environment:
      DATABASE_URL: postgres://app:localdev@postgres:5432/orders?sslmode=disable
    depends_on:
      - postgres

  # Dashboard API service using Dockerfile in ./services/dashboard-api
  dashboard-api:
    build: ./services/dashboard-api
    ports:
      - "8086:8086"
    environment:
      DATABASE_URL: postgres://app:localdev@postgres:5432/orders?sslmode=disable
    depends_on:
      - postgres

volumes:
  pgdata:

